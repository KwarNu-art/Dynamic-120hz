name: Build iOS Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ runner.temp }}/theos
          rm -rf ${{ runner.temp }}/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ${{ runner.temp }}/theos/sdks
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
      - name: Build Rootless DEB
        run: |
          export THEOS=${{ runner.temp }}/theos
          make clean
          make package FINALPACKAGE=1
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unlock120Hz-deb
          path: packages/.deb
